[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medstp"
version = "0.1.0"
description = "Minimal PCA-subspace and Sobel residual-QR visual-token selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["medstp*"]
